[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["attn_bench*"]

[project]
name = "attn-bench"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.3.0",
    "ipywidgets",
]

[project.optional-dependencies]
data = [
    "datasets",
    "huggingface_hub",
    "ftfy",
    "tqdm",
    "pandas",
    "matplotlib",
    "kagglehub",
    "datasketch",
    "nltk",
    "sentence-transformers",
    "scikit-learn",
    "tokenizers",
    "transformers",
    "datatrove",
    "inscriptis",
]
kernels = [
    "flash-attn",
]
analysis = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "seaborn",
    "numba",
    "evaluate",
    "transformers",
    "datasets",
    "tqdm",
]
